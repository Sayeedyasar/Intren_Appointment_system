version: '3.9'

services:
  backend:
    build:
      context: ./backend
    container_name: clinic-backend
    ports:
      - '8000:8000'
    environment:
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    container_name: clinic-frontend
    depends_on:
      - backend
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
